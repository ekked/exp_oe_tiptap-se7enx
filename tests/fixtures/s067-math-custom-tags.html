<p>The area is <span class="ezoeItemCustomTag math_latex" type="custom" customattributes="display|inlineattribute_separationalt|pi r squared">\pi r^2</span> and the sum <span class="ezoeItemCustomTag math_mathml" type="custom" customattributes="display|inlineattribute_separationmathml|&lt;math&gt;&lt;mi&gt;a&lt;/mi&gt;&lt;mo&gt;+&lt;/mo&gt;&lt;mi&gt;b&lt;/mi&gt;&lt;/math&gt;">a plus b</span>.</p><p><span class="ezoeItemCustomTag math_latex" type="custom" customattributes="display|blockattribute_separationalt|x equals minus b plus or minus the root of b squared minus 4ac, over 2a">x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}</span></p><p><span class="ezoeItemCustomTag math_mathml" type="custom" customattributes="display|blockattribute_separationmathml|&lt;math display=&quot;block&quot;&gt;&lt;msup&gt;&lt;mi&gt;e&lt;/mi&gt;&lt;mrow&gt;&lt;mi&gt;i&lt;/mi&gt;&lt;mi&gt;&amp;#960;&lt;/mi&gt;&lt;/mrow&gt;&lt;/msup&gt;&lt;mo&gt;=&lt;/mo&gt;&lt;mn&gt;-1&lt;/mn&gt;&lt;/math&gt;">e to the i pi equals minus one</span></p><p>Text with <strong>bold <span class="ezoeItemCustomTag math_latex" type="custom" customattributes="display|inlineattribute_separationalt|a over b">\frac{a}{b}</span></strong> after.</p><p><br></p>
